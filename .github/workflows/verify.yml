name: verify

# 在**两个平台**上跑同一套门禁（P6-3）。
#
# 为什么必须双平台：这个仓库原本是 Windows 优先写出来的（脚本、路径判断、
# PowerShell 编码），而"只有本机能过"的提交是真实存在的风险 —— 本地绿、
# 别人机器上红，而红的往往是最基础的东西（路径分隔符、编码、行尾）。
# 双平台把这类问题挡在 PR 上，而不是等使用者踩到。
#
# 矩阵刻意**只有两个平台**：更多平台（macOS）带来的边际信息很低，
# 而每个平台都是一份真实的等待时间。
on:
  push:
    branches: [main, hub]
  pull_request:
  workflow_dispatch:

# 同一分支上后推的提交取消前一次的运行 —— 门禁的价值在"最新那一版过没过"。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # `timeout-minutes` **不是为了省时间，是为了让失败可诊断**：
    # ubuntu 侧曾经几次在「跑 verify_all」里跑到没有结论、日志 404 ——
    # 加上限之后 check-run 注解第一次给出了一句能追的话：
    # `The job has exceeded the maximum execution time of 30m0s`（作业 20:58:01 开始，
    # 30 分钟没跑完，`跑 verify_all` 全程 in_progress）。
    # 也就是说 **Linux 侧的问题是"跑不完"，不是"跑错"**：同一套门禁 Windows 侧 15–18 分钟
    # （其中 pytest 7.6–9 分钟），而这台 2 vCPU 的私有仓 runner 上 30 分钟不够。
    # 所以现在把预算设成 **45 分钟**（Windows 侧的 18 分钟远低于它，两个平台共用矩阵值）。
    # 45 不是"把失败推后"的随意数字：30 已实测不够，再加 50% 余量；
    # 判据 `api/tests/test_ci_workflow.py::test_w12_...` 会钉住"必须设且不超过 60"。
    timeout-minutes: 45
    strategy:
      # 一个平台失败时**不取消另一个**：两边的失败原因常常不同，
      # 而"只看到一边红了"会让人以为另一边是好的。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # 版本与 `api/pyproject.toml` 的 `requires-python = ">=3.12,<3.14"` 对齐。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # `.venv` 放在 `api/` 下是仓库约定（看门狗与 goal 模式按它找解释器）。
      - name: 建 venv 并装后端依赖
        shell: bash
        run: |
          python -m venv api/.venv
          if [ -f api/.venv/bin/python ]; then PY=api/.venv/bin/python; else PY=api/.venv/Scripts/python.exe; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -e "api[dev]"

      - name: 装前端依赖
        shell: bash
        working-directory: web
        run: pnpm install --frozen-lockfile

      # E2E 用的浏览器：只装 chromium（WebKit/Firefox 没跑，装了也是白等）。
      # `--with-deps` 在 ubuntu 上装系统库；windows 上它没有意义但也不会失败。
      - name: 装 E2E 浏览器（chromium）
        shell: bash
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # 门禁本身：`verify_all.py` 一次跑完下列步骤 ——
      #   文档排版检查 / 后端语法检查 / PowerShell 脚本编码检查 /
      #   仓库静态检查（ruff：api + scripts） / 后端 pytest /
      #   provider 矩阵配置检查 /
      #   前端测试 / 前端 lint / 前端 build / 前端 E2E（真浏览器 + 真后端）
      # 这些名字是从 `scripts/verify_all.py` 里**逐字**抄的，不是概述：
      # `api/tests/test_ci_workflow.py` 的 W9 会核对它们对得上，
      # 防的是"两份门禁慢慢变成不同的东西"。
      #
      # **不传 `--real-smoke`** —— CI 里没有 Codex CLI 也没有凭据，真实档必然失败，
      # 而那不是"代码坏了"。同理不传 `--real-recursive-probe`。
      #
      # `provider 矩阵配置检查` **不需要凭据也不需要网络**（它只生成隔离 config.toml
      # 并核对结构），所以它是常驻门禁；CI 上没有 codex 时报告里 `could_load_config`
      # 记 null（**没查**），不会伪装成通过。
      #
      # `前端 E2E` 需要 Playwright 的 chromium（下面那步装），它会**自己起一个后端**
      # （隔离端口 8877 + 隔离状态根 `web/.e2e/`，`RUNNER=mock`），不碰任何常驻实例。
      #
      # `CODEX_BATTLEFIELD_RUNNER=mock` 是**必须**的：`verify_all` 会调
      # `bench_run.py` 之类的脚本，而它们默认读用户的 `runner_mode`。
      # CI 上没有那个配置，但显式钉住更安全 —— 少一次"CI 上偷偷调了真模型"的可能。
      - name: 跑 verify_all（门禁）
        shell: bash
        env:
          CODEX_BATTLEFIELD_RUNNER: mock
          CODEX_BATTLEFIELD_MACHINE_SAFETY_MIN_AVAILABLE_MEMORY_MB: '0'
          # Windows runner 上 Python 的默认 stdout 编码是 **cp1252**，而脚本会打印中文摘要
          # —— 实测红在 `check_markdown_layout.py` 的 `UnicodeEncodeError: 'charmap' codec ...`，
          # Windows 那一侧连第二步都没跑到（run 38895747296 / 38943620205）。
          # `verify_all` 也会给每个子进程钉这两个变量；这里再设一遍是为了覆盖
          # "workflow 里直接调 python" 的情形（例如下面收集诊断那一步）。
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          if [ -f api/.venv/bin/python ]; then PY=api/.venv/bin/python; else PY=api/.venv/Scripts/python.exe; fi
          "$PY" scripts/verify_all.py

      # 失败时把 pytest 的完整输出与前端构建日志附上来。
      # 没有它，PR 上只能看到"exit 1"，还得让人本地复现一遍。
      - name: 失败时收集诊断
        if: failure()
        shell: bash
        run: |
          echo "=== api/tests 最近的 pytest 缓存 ==="
          find api -name 'lastfailed' -o -name 'pytest-*.log' 2>/dev/null | head -20 || true
          echo "=== 环境 ==="
          python --version || true
          pnpm --version || true
